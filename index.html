<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Турнирная Сетка (8 команд - Double Elimination)</title>
    <style>
        body {
            background-color: #222222;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .tournament-wrapper {
            max-width: 1400px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            gap: 35px;
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #2e2e2e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow-x: auto;
        }

        .bracket-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, minmax(260px, 1fr));
            gap: 36px;
            min-width: 1120px;
        }

        .round-col {
            display: flex;
            flex-direction: column;
        }

        .round-header {
            background-color: #2c2c2c;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #cccccc;
            border-bottom: 2px solid #ff7a00;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .round-header.empty-header {
            background-color: transparent;
            border-bottom: 2px solid transparent;
            color: #ff7a00;
        }

        .upper-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 360px;
            position: relative;
        }

        .lower-r1-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 18px;
            height: 210px;
            padding-bottom: 8px;
            box-sizing: border-box;
        }

        .lower-r2-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 210px;
            padding: 8px 0;
            box-sizing: border-box;
        }

        .lower-r3-wrapper, .lower-r4-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 210px;
        }

        .match-node {
            background-color: #3a3a3a;
            border-radius: 4px;
            border: 1px solid #4a4a4a;
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s, transform 0.1s;
            height: 68px;
            box-sizing: border-box;
            margin-left: 18px;
        }

        .match-node:hover {
            border-color: #ff7a00;
            transform: translateY(-2px);
        }

        .match-index {
            position: absolute;
            left: -22px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #888;
            font-weight: bold;
        }

        .team-slot {
            display: flex;
            align-items: center;
            height: 33px;
            border-bottom: 1px solid #2b2b2b;
            background-color: #464646;
        }

        .team-slot:first-child { border-top-left-radius: 3px; border-top-right-radius: 3px; }
        .team-slot:last-child { border-bottom: none; border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; }

        .seed-num {
            background-color: #555555;
            color: #cccccc;
            font-size: 11px;
            width: 26px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #383838;
            font-weight: 600;
        }

        .team-title {
            padding-left: 10px;
            font-size: 13px;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e8e8e8;
        }

        .team-title.placeholder-hint {
            color: #999999;
            font-style: italic;
            font-size: 12px;
        }

        .team-score {
            background-color: #383838;
            width: 32px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
            border-left: 1px solid #2b2b2b;
        }

        .winner-row .team-score { background-color: #ff7a00; color: #ffffff; }
        .winner-row .team-title { color: #ffffff; font-weight: 600; }

        /* МОДАЛЬНОЕ ОКНО ДЛЯ ПРОСМОТРА СКРИНШОТОВ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background-color: #2b2b2b;
            width: 90%;
            max-width: 560px;
            padding: 25px;
            border-radius: 8px;
            position: relative;
            border: 1px solid #444;
        }

        .close-modal-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            color: #999; font-size: 28px; cursor: pointer;
        }
        .close-modal-btn:hover { color: #fff; }

        .modal-header-title {
            font-size: 17px; font-weight: bold;
            border-bottom: 2px solid #ff7a00;
            padding-bottom: 6px; margin-bottom: 20px;
            display: inline-block;
        }

        .vs-flex-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .team-modal-card {
            background-color: #1f1f1f;
            flex: 1; text-align: center;
            padding: 15px; border-radius: 6px;
            border: 1px solid #3a3a3a;
        }

        .avatar-circle {
            width: 40px; height: 40px; background-color: #333;
            border-radius: 50%; display: flex;
            justify-content: center; align-items: center; margin: 0 auto 10px auto;
        }

        .modal-t-name { font-size: 13px; margin-bottom: 10px; font-weight: 500; }
        .modal-t-name.placeholder-hint { color: #888; font-style: italic; }
        .modal-t-score { background-color: #2d2d2d; font-size: 24px; font-weight: bold; padding: 6px 0; border-radius: 4px; }

        .vs-divider { padding: 0 15px; color: #777; font-style: italic; }

        .screenshot-block { border-top: 1px solid #3a3a3a; padding-top: 15px; }
        .screenshot-title { font-size: 13px; color: #aaa; margin-bottom: 12px; }
        .gallery-container { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 5px; }
        
        .preview-img {
            width: 100px; height: 70px; object-fit: cover;
            border-radius: 4px; border: 1px solid #555;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .preview-img:hover { transform: scale(1.03); border-color: #ff7a00; }

        .lightbox-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); display: none;
            justify-content: center; align-items: center; z-index: 10000;
            cursor: zoom-out;
        }
        .lightbox-overlay img {
            max-width: 90%; max-height: 90%;
            border: 2px solid #fff; border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="tournament-wrapper">
        <!-- ВЕРХНЯЯ СЕТКА + ГРАНД-ФИНАЛ -->
        <div class="bracket-grid-4">
            <div class="round-col">
                <div class="round-header">Раунд 1</div>
                <div class="upper-wrapper" id="upper-r1"></div>
            </div>
            <div class="round-col">
                <div class="round-header">Раунд 2</div>
                <div class="upper-wrapper" id="upper-r2"></div>
            </div>
            <div class="round-col">
                <div class="round-header">Полуфиналы</div>
                <div class="upper-wrapper" id="upper-sf"></div>
            </div>
            <div class="round-col">
                <div class="round-header empty-header">🏆 Гранд-Финал</div>
                <div class="upper-wrapper" id="grand-final-col"></div>
            </div>
        </div>

        <!-- НИЖНЯЯ СЕТКА -->
        <div class="bracket-grid-4">
            <div class="round-col">
                <div class="round-header">Раунд нижней сетки 1</div>
                <div class="lower-r1-wrapper" id="lower-r1"></div>
            </div>
            <div class="round-col">
                <div class="round-header">Раунд нижней сетки 2</div>
                <div class="lower-r2-wrapper" id="lower-r2"></div>
            </div>
            <div class="round-col">
                <div class="round-header">Раунд нижней сетки 3</div>
                <div class="lower-r3-wrapper" id="lower-r3"></div>
            </div>
            <div class="round-col">
                <div class="round-header">Раунд нижней сетки 4</div>
                <div class="lower-r4-wrapper" id="lower-r4"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal-overlay" id="matchModal">
        <div class="modal-content">
            <button class="close-modal-btn" id="closeModal">&times;</button>
            <div class="modal-header-title">Результаты матча</div>
            <div class="vs-flex-box">
                <div class="team-modal-card">
                    <div class="avatar-circle">⚡</div>
                    <div class="modal-t-name" id="modal-team1">Команда 1</div>
                    <div class="modal-t-score" id="modal-score1">0</div>
                </div>
                <div class="vs-divider">против</div>
                <div class="team-modal-card">
                    <div class="avatar-circle">⚡</div>
                    <div class="modal-t-name" id="modal-team2">Команда 2</div>
                    <div class="modal-t-score" id="modal-score2">0</div>
                </div>
            </div>
            <div class="screenshot-block">
                <div class="screenshot-title">Скриншоты матча (Нажмите для увеличения)</div>
                <div class="gallery-container" id="screenshotsGallery"></div>
            </div>
        </div>
    </div>

    <div id="lightboxOverlay" class="lightbox-overlay" onclick="this.style.display='none'">
        <img id="lightboxImg" src="" alt="Скриншот">
    </div>

    <!-- ЛОГИКА ТУРНИРНОЙ СЕТКИ -->
    <script>
        const bracketData = {
            "m1": { id: 1, container: "upper-r1", s1: 1, team1: "zernd + miate", score1: 2, s2: 8, team2: "Akuma + Kayix", score2: 1, images: [] },
            "m2": { id: 2, container: "upper-r1", s1: 4, team1: "VikuSiK + aStro_Gart1", score1: 0, s2: 5, team2: "special + Cube", score2: 0, images: [] },
            "m3": { id: 3, container: "upper-r1", s1: 2, team1: "svoloch + BabyNeyz", score1: 0, s2: 7, team2: "STICMAN + isagi", score2: 0, images: [] },
            "m4": { id: 4, container: "upper-r1", s1: 3, team1: "Slabiy + xKros", score1: 0, s2: 6, team2: "Daniil + willave", score2: 0, images: [] },

            "m7": { id: 7, container: "upper-r2", s1: "", team1: "", score1: 0, s2: "", team2: "", score2: 0, ph1: "Победитель 1", ph2: "Победитель 2", images: [] },
            "m8": { id: 8, container: "upper-r2", s1: "", team1: "", score1: 0, s2: "", team2: "", score2: 0, ph1: "Победитель 3", ph2: "Победитель 4", images: [] },

            "m12": { id: 12, container: "upper-sf", s1: "", team1: "", score1: 0, s2: "", team2: "", score2: 0, ph1: "Победитель 7", ph2: "Победитель 8", images: [] },
            "m14": { id: 14, container: "grand-final-col", s1: "", team1: "", score1: 0, s2: "", team2: "", score2: 0, ph1: "Победитель 12", ph2: "Победители из числа проигравшых", images: [] },

            "m5": { id: 5, container: "lower-r1", s1: "", team1: "", score1: 0, s2: "", team2: "", score2: 0, ph1: "Проигравший 1", ph2: "Проигравший 2", images: [] },
            "m6": { id: 6, container: "lower-r1", s1: "", team1: "", score1: 0, s2: "", team2: "", score2: 0, ph1: "Проигравший 3", ph2: "Проигравший 4", images: [] },

            "m10": { id: 10, container: "lower-r2", s1: "", team1: "", score1: 0, s2: "", team2: "", score2: 0, ph1: "Проигравший 8", ph2: "Победитель 5", images: [] },
            "m9": { id: 9, container: "lower-r2", s1: "", team1: "", score1: 0, s2: "", team2: "", score2: 0, ph1: "Проигравший 7", ph2: "Победитель 6", images: [] },

            "m11": { id: 11, container: "lower-r3", s1: "", team1: "", score1: 0, s2: "", team2: "", score2: 0, ph1: "Победитель 10", ph2: "Победитель 9", images: [] },
            "m13": { id: 13, container: "lower-r4", s1: "", team1: "", score1: 0, s2: "", team2: "", score2: 0, ph1: "Проигравший 12", ph2: "Победитель 11", images: [] }
        };

        let store = bracketData;

        function recalculateAllMatches() {
            const keysToReset = ["m7", "m8", "m12", "m14", "m5", "m6", "m10", "m9", "m11", "m13"];
            keysToReset.forEach(k => {
                store[k].team1 = ""; store[k].team2 = ""; store[k].s1 = ""; store[k].s2 = "";
            });

            autoPush("m1", "m7", "team1", "s1", "m5", "team1", "s1");
            autoPush("m2", "m7", "team2", "s2", "m5", "team2", "s2");
            autoPush("m3", "m8", "team1", "s1", "m6", "team1", "s1");
            autoPush("m4", "m8", "team2", "s2", "m6", "team2", "s2");

            autoPush("m5", "m10", "team2", "s2", null, null, null);
            autoPush("m6", "m9", "team2", "s2", null, null, null);

            autoPush("m7", "m12", "team1", "s1", "m9", "team1", "s1");
            autoPush("m8", "m12", "team2", "s2", "m10", "team1", "s1");

            autoPush("m10", "m11", "team1", "s1", null, null, null);
            autoPush("m9", "m11", "team2", "s2", null, null, null);

            autoPush("m12", "m14", "team1", "s1", "m13", "team1", "s1");
            autoPush("m11", "m13", "team2", "s2", null, null, null);
            autoPush("m13", "m14", "team2", "s2", null, null, null);
        }

        function autoPush(matchKey, winKey, winProp, winSeed, loseKey, loseProp, loseSeed) {
            const m = store[matchKey];
            if (!m || !m.team1 || !m.team2 || m.score1 === m.score2) return;

            const wName = m.score1 > m.score2 ? m.team1 : m.team2;
            const wSeed = m.score1 > m.score2 ? m.s1 : m.s2;
            const lName = m.score1 > m.score2 ? m.team2 : m.team1;
            const lSeed = m.score1 > m.score2 ? m.s2 : m.s1;

            if (winKey && winProp) { store[winKey][winProp] = wName; store[winKey][winSeed] = wSeed; }
            if (loseKey && loseProp) { store[loseKey][loseProp] = lName; store[loseKey][loseSeed] = lSeed; }
        }

        function createMatchNode(key) {
            const data = store[key];
            const node = document.createElement('div');
            node.className = 'match-node';
            node.onclick = () => openModalBox(key);

            const hasPlayed = (data.score1 > 0 || data.score2 > 0) && (data.team1 && data.team2);
            const win1 = hasPlayed && data.score1 > data.score2;
            const win2 = hasPlayed && data.score2 > data.score1;

            const dispTeam1 = data.team1 || (data.ph1 ? data.ph1 : '');
            const dispTeam2 = data.team2 || (data.ph2 ? data.ph2 : '');
            
            const isHint1 = !data.team1 && data.ph1;
            const isHint2 = !data.team2 && data.ph2;

            node.innerHTML = `
                <div class="match-index">${data.id}</div>
                <div class="team-slot ${win1 ? 'winner-row' : ''}">
                    <div class="seed-num">${data.s1 !== undefined ? data.s1 : ''}</div>
                    <div class="team-title ${isHint1 ? 'placeholder-hint' : ''}">${dispTeam1}</div>
                    <div class="team-score">${data.team1 && data.team2 ? data.score1 : ''}</div>
                </div>
                <div class="team-slot ${win2 ? 'winner-row' : ''}">
                    <div class="seed-num">${data.s2 !== undefined ? data.s2 : ''}</div>
                    <div class="team-title ${isHint2 ? 'placeholder-hint' : ''}">${dispTeam2}</div>
                    <div class="team-score">${data.team1 && data.team2 ? data.score2 : ''}</div>
                </div>
            `;
            return node;
        }

        function buildTournament() {
            recalculateAllMatches();
            const containers = ["upper-r1", "upper-r2", "upper-sf", "grand-final-col", "lower-r1", "lower-r2", "lower-r3", "lower-r4"];
            containers.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = '';
            });

            const renderOrder = ["m1", "m2", "m3", "m4", "m7", "m8", "m12", "m14", "m5", "m6", "m10", "m9", "m11", "m13"];
            renderOrder.forEach(key => {
                const data = store[key];
                const targetContainer = document.getElementById(data.container);
                if (targetContainer) targetContainer.appendChild(createMatchNode(key));
            });
        }

        // Модальное окно для скриншотов
        const modalOverlay = document.getElementById('matchModal');
        const closeBtn = document.getElementById('closeModal');
        const galleryBox = document.getElementById('screenshotsGallery');

        function openModalBox(key) {
            const match = store[key];
            document.getElementById('modal-team1').innerText = match.team1 || match.ph1 || 'Ожидание';
            document.getElementById('modal-team2').innerText = match.team2 || match.ph2 || 'Ожидание';
            document.getElementById('modal-score1').innerText = match.score1;
            document.getElementById('modal-score2').innerText = match.score2;
            
            galleryBox.innerHTML = '';
            const imgs = match.images || [];
            if (imgs.length === 0) {
                galleryBox.innerHTML = '<div style="color: #666; font-size: 12px;">Скриншотов нет</div>';
            } else {
                imgs.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src; img.className = 'preview-img';
                    img.onclick = () => {
                        document.getElementById('lightboxImg').src = src;
                        document.getElementById('lightboxOverlay').style.display = 'flex';
                    };
                    galleryBox.appendChild(img);
                });
            }
            modalOverlay.classList.add('active');
        }

        closeBtn.onclick = () => modalOverlay.classList.remove('active');
        modalOverlay.onclick = (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); };

        buildTournament();
    </script>
</body>
</html>
